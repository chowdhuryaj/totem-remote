<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Same policy as _headers, for hosts that cannot send headers. Everything is same-origin; icons are inline SVG. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Totem Remote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="row">
    <div id="hostsw" class="seg"><button data-host="Workstation">Workstation</button><button data-host="Mac">Mac</button></div>
    <span id="auto" class="chip">auto</span>
    <span class="grow"></span>
    <button id="connect" class="small primary">Connect</button>
  </div>
  <div id="statusline" class="row">
    <span id="dot"></span>
    <span id="state" class="grow">Not connected</span>
    <span id="statusbar" class="row" hidden>
      <button id="out" class="chip" title="Toggle output"></button>
      <span id="caps" class="chip" hidden>CAPS</span>
      <span id="batt" class="chip" hidden></span>
    </span>
  </div>
</header>

<main>
  <section id="deckarea">
    <div id="pagerow" class="row">
      <span id="pagename" class="grow"></span>
      <span id="pageinfo"></span>
      <span id="dots"></span>
      <button id="deck-edit" class="small">Edit</button>
    </div>
    <div id="pageops" class="row" hidden></div>
    <div id="deck"></div>
  </section>

  <section id="padbox">
    <button id="padhandle">Expand trackpad</button>
    <div id="padwrap">
      <div id="pad"><span class="hint">trackpad</span></div>
      <div id="strip"><span class="hint">scroll</span></div>
    </div>
  </section>
<section id="keys" hidden>
  <div class="row"><button id="kbd" class="primary grow">Open keyboard</button><button data-close>Close</button></div>
  <input id="hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Keyboard capture">
  <div class="grid mods" id="mods"></div>
  <div class="grid" id="special"></div>
</section>
</main>

<nav>
  <button id="nb-keys">Keyboard</button>
  <button id="nb-km">Keymap</button>
  <button id="nb-gest">Gestures</button>
  <button id="nb-set">Settings</button>
</nav>



<dialog id="km" class="sheet tall">
  <div class="row"><b class="grow">Keymap</b><span id="km-cfg" class="chip" hidden></span><span id="km-unsaved" class="chip warn" hidden>unsaved</span><button id="km-close" class="small">Close</button></div>
  <div id="km-msg"></div>
  <div class="row"><button id="km-connect" class="primary grow">Connect to keyboard</button></div>
  <div id="km-layers"></div>
  <div id="km-layerops" class="row" hidden><button id="km-rename" class="small">Rename</button><button id="km-add" class="small">Add</button><button id="km-remove" class="small">Remove</button><button id="km-up" class="small">Up</button><button id="km-down" class="small">Down</button></div>
  <div id="km-board"></div>
  <div id="km-actions" class="row" hidden><button id="km-save" class="primary grow">Save changes</button><button id="km-discard" class="grow">Discard</button></div>
</dialog>

<dialog id="picker" class="sheet tall">
  <div class="row"><b id="pk-title" class="grow"></b></div>
  <div id="pk-current"></div>
  <div id="pk-preview"></div>
  <div id="pk-params"></div>
  <div class="row"><button id="pk-apply" class="primary grow">Apply</button><button id="pk-cancel" class="grow">Cancel</button></div>
  <p id="pk-msg"></p>
  <input id="pk-search" type="search" placeholder="Search keys and behaviors" autocomplete="off" spellcheck="false">
  <div id="pk-list"></div>
</dialog>

<dialog id="gests" class="sheet">
  <div class="row"><b id="gesthost" class="grow"></b><button data-close>Close</button></div>
  <div class="grid" id="gest"></div>
</dialog>

<dialog id="settings" class="sheet">
  <div class="row"><b class="grow">Settings</b><button data-close>Close</button></div>
  <label class="field">Pointer speed <input id="speed" type="range" min="0.5" max="4" step="0.1"></label>
  <label class="field"><input id="natural" type="checkbox"> Natural scroll</label>
  <div class="row"><button id="demo" class="grow">Demo</button></div>
  <textarea id="jsonta" rows="8" spellcheck="false" placeholder="Deck JSON (export, or paste to import)"></textarea>
  <div class="row"><button id="json-export">Export</button><button id="json-import" class="primary">Import (replace)</button><button id="json-reset">Reset</button></div>
  <p id="json-msg"></p>
  <pre id="log" hidden></pre>
</dialog>

<dialog id="editor" class="sheet"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
